<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bionova Simulator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ─── FONDO ESTÁTICO (LAZO AZUL + RESPLANDORES) ─── -->
    <div class="bg-wave-glow"></div>
    <div class="bg-wave-glow b"></div>
    <div class="bg-wave-wrap">
        <img src="img\pexels-raulling-34169628.jpg" alt="Fondo lazo azul">
    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">

        <!-- LOGO -->
        <div class="logo-container">

            <div class="logo-icon">
                <img src="img\mundo.png" height="40px" width="40px">
            </div>

            <div class="logo-text">
                <span>Bionova</span>
                <small>Simulator</small>
            </div>

        </div>


        <!-- MENÚ -->
        <nav class="menu">

            <a href="#" class="nav-item active">
                <span class="icon">⌂</span>
                <span>Inicio</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">▤</span>
                <span>Temas</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">⌁</span>
                <span>Simulador</span>
            </a>

            <a href="#" class="nav-item">
                <span class="icon">▧</span>
                <span>Acerca de</span>
            </a>

        </nav>


        <!-- BOTONES -->
        <div class="actions">

            <button class="start-button">
                <span>Comenzar</span>

                <span class="arrow-button">
                    ↗
                </span>
            </button>
        </div>

    </header>


    <script src="java.js"></script>

</body>

</html>
