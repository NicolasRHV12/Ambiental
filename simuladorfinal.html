<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bionova Simulator</title>

    <!-- ÍCONO DE LA PESTAÑA -->
    <link rel="icon" type="image/png" href="img/planeta-tierra.png">
    <link rel="shortcut icon" type="image/png" href="img/planeta-tierra.png">
    <link rel="apple-touch-icon" href="img/planeta-tierra.png">

    <!-- Librerías amCharts 5 -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0e6d6;
        }

        #chartdiv {
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        /* Crédito del autor */
        .author-credit {
            position: fixed;
            bottom: 16px;
            left: 18px;
            z-index: 1000;
            font-size: 12px;
            color: #92877a;
            text-decoration: none;
            transition: color 0.3s ease,
                        text-shadow 0.3s ease,
                        opacity 0.3s ease;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }

        .author-credit:hover {
            color: #5c3a1e;
            opacity: 1;
            text-shadow: 0 0 8px rgba(139, 94, 60, 0.35);
        }

        .author-credit:focus-visible {
            outline: 2px solid #8b5e3c;
            outline-offset: 4px;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .author-credit {
                bottom: 10px;
                left: 12px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Simulador interactivo -->
    <div id="chartdiv"></div>

    <!-- Autor del proyecto original -->
    <a
        class="author-credit"
        href="https://codepen.io/amcharts"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver los proyectos de amCharts en CodePen"
        title="Ver proyectos de amCharts en CodePen"
    >
        amCharts ↗
    </a>

    <script>
        // Crear elemento raíz
        var root = am5.Root.new("chartdiv");

        // Tema personalizado de café
        var coffeeTheme = am5.Theme.new(root);

        coffeeTheme.rule("InterfaceColors").setAll({
            primaryButton: am5.color(0x8b5e3c),
            primaryButtonHover: am5.color(0x5c3a1e),
            primaryButtonDown: am5.color(0x3c1e0e),
            primaryButtonActive: am5.color(0xc4956a),
            primaryButtonText: am5.color(0xf5ece0),
            secondaryButton: am5.color(0xe8d5b7),
            secondaryButtonHover: am5.color(0xd4c4a8),
            secondaryButtonDown: am5.color(0xc4956a),
            secondaryButtonText: am5.color(0x3c1e0e),
            background: am5.color(0xe8d5b7),
            text: am5.color(0x3c1e0e)
        });

        root.setThemes([
            am5themes_Animated.new(root),
            coffeeTheme
        ]);

        // Fondo estilo papel
        root.container.set("background",
            am5.Rectangle.new(root, {
                fill: am5.color(0xf0e6d6),
                fillPattern: am5.GrainPattern.new(root, {
                    density: 0.4,
                    maxOpacity: 0.07,
                    colors: [am5.color(0x000000)]
                })
            })
        );

        // Paleta de colores
        var espresso = am5.color(0x3c1e0e);
        var darkRoast = am5.color(0x5c3a1e);
        var mediumRoast = am5.color(0x8b5e3c);
        var lightRoast = am5.color(0xc4956a);
        var crema = am5.color(0xe8d5b7);
        var cream = am5.color(0xf5ece0);

        // Crear mapa interactivo
        var chart = root.container.children.push(
            am5map.MapChart.new(root, {
                panX: "rotateX",
                panY: "rotateY",
                projection: am5map.geoOrthographic(),
                rotationX: -15,
                rotationY: -20,
                minZoomLevel: 0.5,
                zoomLevel: 0.9
            })
        );

        // Fondo del mapa
        var bgSeries = chart.series.push(
            am5map.MapPolygonSeries.new(root, {})
        );

        bgSeries.mapPolygons.template.setAll({
            fill: am5.color(0xede4d4),
            fillOpacity: 1,
            strokeOpacity: 0
        });

        bgSeries.data.push({
            geometry: am5map.getGeoRectangle(
                90, 180, -90, -180
            )
        });

        // Líneas geográficas
        var graticuleSeries = chart.series.push(
            am5map.GraticuleSeries.new(root, {})
        );

        graticuleSeries.mapLines.template.setAll({
            stroke: mediumRoast,
            strokeOpacity: 0.15,
            strokeWidth: 0.5
        });

        // Países del mundo
        var polygonSeries = chart.series.push(
            am5map.MapPolygonSeries.new(root, {
                geoJSON: am5geodata_worldLow
            })
        );

        polygonSeries.mapPolygons.template.setAll({
            fill: cream,
            stroke: lightRoast,
            strokeWidth: 0.5,
            strokeOpacity: 0.5
        });

        // Países productores
        var producerIds = ["BR", "VN", "CO", "ET", "ID", "HN"];

        // Centros de distribución
        var hubIds = ["DE", "BE", "IT", "US"];

        // Mercados consumidores
        var consumerIds = [
            "FR", "PL", "SE", "RU", "GB",
            "NL", "GR", "AT", "CA", "JP"
        ];

        // Colorear países
        polygonSeries.events.on("datavalidated", function () {
            am5.array.each(polygonSeries.dataItems, function (di) {
                var id = di.get("id");
                var polygon = di.get("mapPolygon");

                if (!id || !polygon) return;

                if (producerIds.includes(id)) {
                    polygon.set("fill", am5.color(0x8fae7e));
                } else if (hubIds.includes(id)) {
                    polygon.set("fill", am5.color(0xc4a878));
                } else if (consumerIds.includes(id)) {
                    polygon.set("fill", am5.color(0xddc8a0));
                }
            });
        });

        // Rutas de distribución
        var sankeySeries = chart.series.push(
            am5map.MapSankeySeries.new(root, {
                polygonSeries: polygonSeries,
                maxWidth: 2,
                controlPointDistance: 0.4,
                resolution: 60,
                nodePadding: 0.3
            })
        );

        sankeySeries.mapPolygons.template.setAll({
            fill: mediumRoast,
            fillOpacity: 0.65,
            strokeOpacity: 0,
            tooltipText: "{sourceNode.name} > {targetNode.name}\n{value}k tonnes"
        });

        sankeySeries.nodes.mapPolygons.template.setAll({
            fill: espresso,
            stroke: crema,
            strokeWidth: 1.5,
            fillOpacity: 0.95,
            strokeOpacity: 1,
            tooltipText: "{name}\n{sum}k tonnes"
        });

        // Granos de café animados
        sankeySeries.bullets.push(function () {
            return am5.Bullet.new(root, {
                locationX: 0,
                autoRotate: true,
                sprite: am5.Graphics.new(root, {
                    svgPath:
                        "M-4,-2.5 C-4,-5 -1.5,-6.5 1,-6.5 " +
                        "C3.5,-6.5 5,-4.5 5,-2 C5,1 3,3.5 " +
                        "0.5,5 C-0.5,5.7 -1.5,5.7 -2.5,5 " +
                        "C-5,3.5 -6,1 -4,-2.5 Z " +
                        "M-1,-5 C-1,-1 -1,2 -0.5,4.5",
                    fill: espresso,
                    stroke: darkRoast,
                    strokeWidth: 0.5,
                    centerX: am5.p50,
                    centerY: am5.p50,
                    scale: 0.35,
                    visible: false
                })
            });
        });

        // Datos de las rutas internacionales
        sankeySeries.data.setAll([
            { sourceId: "BR", targetId: "DE", value: 350 },
            { sourceId: "BR", targetId: "US", value: 450 },
            { sourceId: "BR", targetId: "IT", value: 200 },
            { sourceId: "VN", targetId: "DE", value: 200 },
            { sourceId: "VN", targetId: "BE", value: 150 },
            { sourceId: "CO", targetId: "US", value: 250 },
            { sourceId: "CO", targetId: "DE", value: 80 },
            { sourceId: "ET", targetId: "DE", value: 60 },
            { sourceId: "ET", targetId: "BE", value: 40 },
            { sourceId: "ID", targetId: "US", value: 80 },
            { sourceId: "HN", targetId: "DE", value: 60 },
            { sourceId: "HN", targetId: "BE", value: 40 },

            { sourceId: "DE", targetId: "FR", value: 150 },
            { sourceId: "DE", targetId: "PL", value: 100 },
            { sourceId: "DE", targetId: "SE", value: 80 },
            { sourceId: "DE", targetId: "RU", value: 120 },
            { sourceId: "BE", targetId: "GB", value: 100 },
            { sourceId: "BE", targetId: "NL", value: 80 },
            { sourceId: "IT", targetId: "GR", value: 50 },
            { sourceId: "IT", targetId: "AT", value: 40 },
            { sourceId: "US", targetId: "CA", value: 120 },
            { sourceId: "US", targetId: "JP", value: 80 }
        ]);

        // Nombres de los países
        var countryNames = {
            BR: "Brazil",
            VN: "Vietnam",
            CO: "Colombia",
            ET: "Ethiopia",
            ID: "Indonesia",
            HN: "Honduras",
            DE: "Germany",
            BE: "Belgium",
            IT: "Italy",
            US: "United States",
            FR: "France",
            PL: "Poland",
            SE: "Sweden",
            RU: "Russia",
            GB: "United Kingdom",
            NL: "Netherlands",
            GR: "Greece",
            AT: "Austria",
            CA: "Canada",
            JP: "Japan"
        };

        // Animar los flujos
        sankeySeries.events.on("datavalidated", function () {
            am5.array.each(
                sankeySeries.nodes.dataItems,
                function (di) {
                    var id = di.get("id");

                    if (id && countryNames[id]) {
                        di.set("name", countryNames[id]);
                    }
                }
            );

            am5.array.each(
                sankeySeries.dataItems,
                function (dataItem) {
                    var bullets = dataItem.bullets;

                    if (!bullets) return;

                    am5.array.each(bullets, function (bullet) {
                        var randomDur = 3000 + Math.random() * 3000;
                        var delay = Math.random() * randomDur;

                        setTimeout(function () {
                            var sprite = bullet.get("sprite");

                            if (sprite) {
                                sprite.set("visible", true);
                            }

                            bullet.animate({
                                key: "locationX",
                                from: 0,
                                to: 1,
                                duration: randomDur,
                                easing: am5.ease.linear,
                                loops: Infinity
                            });
                        }, delay);
                    });
                }
            );
        });

        // Título y subtítulo
        var titleCont = chart.children.push(
            am5.Container.new(root, {
                layout: root.verticalLayout,
                x: am5.p50,
                centerX: am5.p50,
                y: am5.p100,
                centerY: am5.p100,
                position: "absolute",
                paddingBottom: 16
            })
        );

        titleCont.children.push(
            am5.Label.new(root, {
                text: "Simulador Final",
                fontSize: 18,
                fontWeight: "600",
                fill: espresso,
                x: am5.p50,
                centerX: am5.p50
            })
        );

        titleCont.children.push(
            am5.Label.new(root, {
                text: "Aplicativo Interactivo y Dinamico",
                fontSize: 11,
                fill: mediumRoast,
                x: am5.p50,
                centerX: am5.p50
            })
        );

        // Selector Globo / Mapa
        var switchCont = chart.children.push(
            am5.Container.new(root, {
                layout: root.horizontalLayout,
                x: 20,
                y: 40
            })
        );

        switchCont.children.push(
            am5.Label.new(root, {
                centerY: am5.p50,
                text: "Globe",
                fill: espresso,
                fontSize: 13
            })
        );

        var switchButton = switchCont.children.push(
            am5.Button.new(root, {
                themeTags: ["switch"],
                centerY: am5.p50,
                icon: am5.Circle.new(root, {
                    themeTags: ["icon"]
                })
            })
        );

        var easing = am5.ease.inOut(am5.ease.cubic);
        var duration = 1500;
        var fadeDuration = 300;

        // Mostrar globo
        function zoomToGlobe() {
            chart.set("projection", am5map.geoOrthographic());
            chart.set("panX", "rotateX");
            chart.set("panY", "rotateY");

            chart.animate({
                key: "rotationX",
                to: -15,
                duration: duration,
                easing: easing
            });

            chart.animate({
                key: "rotationY",
                to: -20,
                duration: duration,
                easing: easing
            });

            bgSeries.mapPolygons.template.set("fillOpacity", 1);
            chart.set("minZoomLevel", 0.9);

            chart.animate({
                key: "zoomLevel",
                to: 0.9,
                duration: duration,
                easing: easing
            });
        }

        // Mostrar mapa plano
        function zoomToMap() {
            chart.set("projection", am5map.geoMercator());
            chart.set("panX", "translateX");
            chart.set("panY", "translateY");

            chart.animate({
                key: "rotationX",
                to: 0,
                duration: duration,
                easing: easing
            });

            chart.animate({
                key: "rotationY",
                to: 0,
                duration: duration,
                easing: easing
            });

            bgSeries.mapPolygons.template.set("fillOpacity", 0);
            chart.set("minZoomLevel", 1);

            chart.animate({
                key: "zoomLevel",
                to: 1.7,
                duration: duration,
                easing: easing
            });
        }

        // Transición entre globo y mapa
        switchButton.on("active", function () {
            chart.goHome(duration);

            setTimeout(function () {
                chart.seriesContainer.animate({
                    key: "opacity",
                    to: 0,
                    duration: fadeDuration
                });
            }, duration - fadeDuration);

            setTimeout(function () {
                if (switchButton.get("active")) {
                    zoomToMap();
                } else {
                    zoomToGlobe();
                }

                chart.seriesContainer.animate({
                    key: "opacity",
                    to: 1,
                    duration: fadeDuration
                });
            }, duration);
        });

        switchCont.children.push(
            am5.Label.new(root, {
                centerY: am5.p50,
                text: "Map",
                fill: espresso,
                fontSize: 13
            })
        );

        // Controles de zoom
        var zoomControl = chart.set(
            "zoomControl",
            am5map.ZoomControl.new(root, {})
        );

        zoomControl.homeButton.set("visible", true);

        // Rotación automática
        var rotationAnimation = chart.animate({
            key: "rotationX",
            from: -15,
            to: -15 + 360,
            duration: 120000,
            loops: Infinity,
            easing: am5.ease.linear
        });

        // Detener rotación al interactuar
        chart.chartContainer.events.on("pointerdown", function () {
            if (rotationAnimation) {
                rotationAnimation.stop();
                rotationAnimation = null;
            }
        });

        // Animación inicial
        chart.appear(1000, 100);
    </script>

</body>
</html>
```
